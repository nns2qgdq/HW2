[project]
name = "hw2-v2"
version = "0.1.0"
description = "Flood Probability multiple linear regression coursework"
readme = "README.md"
authors = [
    { name = "Ryder", email = "ryder@kknet.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]


[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
